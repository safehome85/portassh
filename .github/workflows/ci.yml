name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Generate baked.go (test keys)
        run: ./scripts/gen-baked.sh ci-relay.invalid
      - name: Vet
        run: go vet ./...
      - name: Tests
        run: go test -v ./...

  build-windows:
    name: Windows 386 build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Generate baked.go (test keys)
        run: ./scripts/gen-baked.sh ci-relay.invalid
        shell: bash
      - name: Vet
        run: go vet ./...
        shell: bash
      - name: Build
        run: go build -trimpath -ldflags "-s -w -H=windowsgui" -o portassh.exe .
        shell: bash
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: portassh-windows-386
          path: portassh.exe

  cross-compile:
    name: Cross-compile ${{ matrix.goarch }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        goarch: [amd64, 386, arm64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Generate baked.go (test keys)
        run: ./scripts/gen-baked.sh ci-relay.invalid
      - name: Build windows/${{ matrix.goarch }}
        run: GOOS=windows GOARCH=${{ matrix.goarch }} go build -o /dev/null .
